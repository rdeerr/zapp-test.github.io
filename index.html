
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The App Guys - 5 Star Bistro Reservations</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f4ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #333;
}

.header {
    background: #2a6c42;
    color: white;
    padding: 40px 20px;
}

.header-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.title-block {
    flex: 1;
}

.header h1 {
    margin: 0;
    font-size: 2.4rem;
    font-weight: 700;
}

.header h2 {
    margin: 10px 0;
    font-size: 1.15rem;
    font-weight: 400;
    opacity: .95;
}

.header p {
    margin-top: 18px;
    opacity: .9;
}

.logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    flex-shrink: 0;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 24px;
}

.success {
    display: none;
    background: #d9eadf;
    border-left: 4px solid #2a6c42;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #234a30;
}

.slot {
    background: white;
    border-radius: 14px;
    margin-bottom: 12px;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.slot strong {
    font-size: 1.05rem;
}

button {
    background: #2a6c42;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    opacity: .92;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-card {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 14px;
    padding: 24px;
}

.modal-card h3 {
    margin-top: 0;
    text-align: center;
    color: #2a6c42;
}

.modal-card p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin: 12px 0 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.button-row {
    display: flex;
    gap: 10px;
}

.button-row button {
    flex: 1;
}

.cancel-btn {
    background: #d8d8d8;
    color: #333;
}

.footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: .85rem;
}

@media(max-width:600px) {

    .header-inner {
        flex-direction: column-reverse;
        text-align: center;
    }

    .logo {
        width: 90px;
        height: 90px;
    }

    .header h1 {
        font-size: 2rem;
    }

    .button-row {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="header-inner">

        <div class="title-block">
            <h1>The App Guys</h1>
            <h2>5 Star Bistro Reservations</h2>
            <p>Reserve your time slot for a special presentation and a little special treatment!</p>
        </div>

        <img src="site-logo.png" width="100px">

    </div>

</div>

<div class="container">

    <div id="success" class="success">
        Reservation saved successfully.
    </div>

    <div id="slots"></div>

</div>

<div id="modal" class="modal">

    <div class="modal-card">

        <h3 id="selectedTime"></h3>

        <p>
            Enter your name below to reserve this table.
        </p>

        <input
            id="name"
            placeholder="Your Name">

        <div class="button-row">

            <button
                class="cancel-btn"
                onclick="closeModal()">
                Choose Another Time
            </button>

            <button onclick="saveReservation()">
                Reserve
            </button>

        </div>

    </div>

</div>

<div class="footer">
    Reservations are available on a first come, first served basis.<br>
</div>

<script>

const times = [
    "6:00 PM",
    "6:15 PM",
    "6:30 PM",
    "6:45 PM",
    "7:00 PM",
    "7:15 PM",
    "7:30 PM",
    "7:45 PM",
    "8:00 PM",
    "8:15 PM",
    "8:30 PM"
];

const slotContainer = document.getElementById("slots");

let selectedTime = null;

function renderSlots() {

    slotContainer.innerHTML = "";

    times.forEach(function(time){

        const slot = document.createElement("div");

        slot.className = "slot";

        slot.innerHTML = `
            <strong>${time}</strong>
            <button type="button" onclick="openModal('${time}')">
                Reserve
            </button>
        `;

        slotContainer.appendChild(slot);

    });

}

function openModal(time){

    selectedTime = time;

    document.getElementById("selectedTime").innerText =
        "Reservation Time: " + time;

    document.getElementById("modal").style.display =
        "flex";

}

function closeModal(){

    document.getElementById("modal").style.display =
        "none";

    document.getElementById("name").value = "";

    selectedTime = null;

}

function saveReservation(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    if(!name){

        alert("Please enter your name.");

        return;

    }

    alert(
        "Reservation confirmed for " +
        name +
        " at " +
        selectedTime
    );

    closeModal();

    const success =
        document.getElementById("success");

    success.style.display = "block";

    setTimeout(function(){

        success.style.display = "none";

    }, 5000);

}

document
    .getElementById("modal")
    .addEventListener("click", function(e){

        if(e.target.id === "modal"){

            closeModal();

        }

    });

window.onload = function(){

    renderSlots();

};

</script>

</body>
</html>
